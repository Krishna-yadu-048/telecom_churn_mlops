name: ML Pipeline CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v

  train:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      GIT_PYTHON_REFRESH: quiet

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Configure DVC remote credentials
        run: |
          uv run dvc remote modify origin --local auth basic
          uv run dvc remote modify origin --local user ${{ secrets.DAGSHUB_USERNAME }}
          uv run dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull latest data
        run: uv run dvc pull

      - name: Run DVC pipeline
        run: uv run dvc repro

      - name: Push artifacts
        run: uv run dvc push

      - name: Log training run to MLflow
        run: uv run python src/train.py